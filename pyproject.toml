[project]
name = "fyp-sim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"